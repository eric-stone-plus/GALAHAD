[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantkit"
version = "0.3.0"
description = "Shared quantitative-research toolkit (GALAHAD)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
# Runtime deps live in requirements.txt (managed with the shared venv).

[tool.setuptools.packages.find]
where = ["."]
include = ["quantkit*"]
