[project]
name = "galahad-futures"
version = "0.1.0"
description = "GALAHAD private USDT-M futures paper substrate (margin, risk gate, dual-MA targets)"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "pyyaml",
  "pytest",
]

[tool.setuptools.packages.find]
include = ["galahad_futures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
